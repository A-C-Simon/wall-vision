[metadata]
name = wallvision
version = 0.1.0
description = CSI motion sensing with explicit measurement quality checks

[options]
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.23,<3
    scipy>=1.9,<2

[options.packages.find]
include = wallvision*

[options.entry_points]
console_scripts =
    wallvision = wallvision.cli:main
